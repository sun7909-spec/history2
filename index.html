</style></head><body><header><small>TIME MACHINE / HISTORY QUEST · 중3 역사</small><h1>희연쌤이 만든 근대 타임머신</h1><div class="mission">🚀 시간 여행 임무: 주요 사건을 익히고 역사의 순서를 복원하라!</div><div class="hero-orbit" aria-hidden="true">⏳</div></header><main><nav id="nav"></nav><div class="controls"><label for="era">📍 학습 범위 </label><select id="era"><option value="0">1. 문호 개방과 개화 (176~177쪽)</option><option value="1">2. 국민 국가 수립과 국권 수호 (178~179쪽)</option><option value="3" selected>전체 종합 (176~179쪽)</option></select></div><section class="panel" id="view"></section></main><footer>학습 자료: 미래엔 역사② 176~179쪽 · 인터넷 연결 없이 실행 가능</footer><dialog id="result"><div id="resultBody"></div></dialog><script>
const raw=[[0,'1866','병인양요','흥선 대원군 집권기에 프랑스와 충돌하였다.','통상 수교 거부'],[0,'1871','신미양요','흥선 대원군 집권기에 미국과 충돌하였다.','통상 수교 거부'],
[0,'1876','강화도 조약','일본의 강요로 조선이 문호를 개방한 불평등 조약.','문호 개방'],[0,'1882','임오군란','경제적 어려움을 겪던 민중과 구식 군인이 저항하였다.','구식 군인'],[0,'1884','갑신정변','김옥균 등 급진 개화파가 근대 국가 수립을 시도했으나 실패하였다.','급진 개화파'],[0,'1894','동학 농민 운동','전봉준 등이 신분제 폐지, 조세 개혁, 외세 배격을 요구하였다.','전봉준'],[0,'1894','청·일 전쟁','청과 일본이 전쟁을 벌였으며 일본이 승리하였다.','일본 승리'],[0,'1894','갑오개혁','개화파 중심 정부가 신분제와 낡은 악습을 폐지하는 개혁을 추진하였다.','신분제 폐지'],[0,'1895','을미사변','일본이 명성 황후를 시해하고 조선 내정에 대한 간섭을 강화하였다.','명성 황후'],[0,'1896','아관 파천','신변의 위협을 느낀 고종이 러시아 공사관으로 처소를 옮겼다.','러시아 공사관'],
[1,'1896','독립 협회 조직','개화 지식인들이 자주독립과 근대적 민권을 강조하고 만민 공동회를 열어 열강의 간섭을 규탄하였다.','자주독립·민권'],[1,'1897','대한 제국 수립','고종이 황제에 즉위하고 자주독립국임을 선포하였다.','고종·광무개혁'],[1,'1897','광무개혁','대한 제국이 황제를 중심으로 상공업 진흥, 실업 학교 설립 등을 추진하였다.','상공업 진흥·실업 학교 설립'],[1,'1898','관민 공동회','독립 협회가 정부 대신도 참여하는 집회를 열어 자주독립을 주장하였다.','정부 대신 참여'],[1,'1904','러·일 전쟁','한반도를 둘러싼 러시아와 일본의 전쟁이 시작되었다.','러시아·일본'],[1,'1905','을사늑약','일본이 대한 제국을 보호국으로 만들고 외교권을 빼앗았다.','국권 침탈'],[1,'1907','헤이그 특사 파견','고종이 일제 침략의 부당성을 국제 사회에 알리고자 하였다. 이후 강제 퇴위와 군대 해산이 이어졌다.','고종·특사'],[1,'1910','국권 피탈','일제가 한국을 강제로 병합하여 식민지로 삼았다.','강제 병합']];
const data=raw.map((r,i)=>({g:r[0],y:r[1],n:r[2],d:r[3],k:r[4],id:i}));let mode=0,era=3,questions=[],qi=0,score=0,answered=false,bank=[],chosen=[],checked=false,round=0,wins=0,passed=false,attempts=0,student="";const $=id=>document.getElementById(id), shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}, pool=()=>data.filter(e=>era===3||e.g===era);const names=['🧭 01 사건 탐험','🔎 02 사건 추리 퀴즈','🚀 03 타임라인 챌린지'];const rounds=[['강화도 조약','갑신정변','갑오개혁','을미사변'],['임오군란','동학 농민 운동','아관 파천','대한 제국 수립'],['독립 협회 조직','대한 제국 수립','을사늑약','헤이그 특사 파견','국권 피탈'],['광무개혁','관민 공동회','러·일 전쟁','을사늑약','헤이그 특사 파견','국권 피탈'],['병인양요','신미양요','강화도 조약','임오군란','청·일 전쟁','독립 협회 조직','대한 제국 수립','국권 피탈']];
function start(m){if(mode===2&&wins<5&&!confirm('진행 중인 챌린지가 초기화됩니다. 이동할까요?'))return;mode=m;qi=score=0;answered=false;round=wins=attempts=0;passed=false;questions=shuffle(pool()).slice(0,era===3?12:8).map(e=>({e,opts:shuffle([e,...shuffle(pool().filter(x=>x!==e)).slice(0,3)])}));const e={id:100,n:'상공업 진흥과 실업 학교 설립',y:'1897',k:'광무개혁',d:'대한 제국은 황제를 중심으로 상공업을 진흥하고 실업 학교를 설립하였다.'};if(era!==0)questions.unshift({e,prompt:'광무개혁의 주요 내용으로 옳은 것은?',opts:shuffle([e,{id:101,n:'통상 수교 거부'},{id:102,n:'신분제와 낡은 악습 폐지'},{id:103,n:'러시아 공사관으로 이동'}])});if(m===2){era=3;$('era').value='3';student='';}newRound();render()}
function newRound(){bank=shuffle(rounds[round].map(n=>data.find(e=>e.n===n)));chosen=[];checked=false;passed=false}
function retry(){chosen=[];checked=false;passed=false;render()}
function advance(){if(!passed||mode!==2)return;if(wins===5){mode=3;render();return}round++;newRound();render()}
function render(){ $('era').disabled=mode>=2; $('nav').innerHTML=names.map((n,i)=>`<button class="${mode===i?'active':''}" onclick="start(${i})">${n}</button>`).join('');if(mode===3){$('view').innerHTML=`<div style="text-align:center;padding:35px 10px"><div style="font-size:72px">🏆</div><h1 style="color:#176b70">🎉 챌린지 성공!</h1><h2>시간 여행 마스터</h2><p>⭐ ⭐ ⭐ ⭐ ⭐<br>5개 챌린지 모두 통과 · 5 / 5</p><div class="progress"><i style="width:100%"></i></div><p>학생 이름: <input id="student" placeholder="이름 입력" style="font:inherit;padding:10px;max-width:90%" oninput="student=this.value"></p><p>정답 확인 시도: ${attempts}회</p><p>완료 시각: ${new Date().toLocaleString('ko-KR')}</p><h3>📸 이 화면을 선생님께 보여 주세요.</h3><button onclick="window.print()">인쇄</button> <button onclick="start(0)">처음으로</button></div>`;$('student').value=student;return}if(mode===0){$('view').innerHTML=`<h2>🧭 STEP 1. 역사 사건 탐험</h2><p class="muted">사건의 연도와 핵심 내용을 읽고 키워드를 기억하세요.</p><div class="grid">${pool().map(e=>`<article class="event"><div class="year">${e.y}년</div><h3>${["🌊","🌊","📜","👥","💡","🌾","🌏","⚙️","📜","🏛️","🤝","👑","🏫","📣","🌏","📜","✉️","📜"][e.id]} ${e.n}</h3><p>${e.d}</p><span class="tag">${e.k}</span></article>`).join('')}</div><div class="controls"><button class="primary" onclick="start(1)">🔓 퀴즈 도전 →</button></div>`;return}if(mode===1){if(qi===questions.length){$('view').innerHTML=`<h2>🎉 퀴즈 완료!</h2><h1>${score} / ${questions.length} 정답</h1><p>모든 문제를 해결했어요! 이제 시간 여행 미션에 도전하세요.</p><button onclick="start(1)">다시 도전</button> <button class="primary" onclick="start(2)">🚀 타임라인 도전 →</button>`;return}let q=questions[qi];$('view').innerHTML=`<h2>🔎 STEP 2. 사건 추리 퀴즈</h2><p>문제 ${qi+1}/${questions.length} · 정답 ${score}개</p><div class="progress"><i style="width:${qi/questions.length*100}%"></i></div><h2>${q.prompt||q.e.d}</h2><div class="choices">${q.opts.map(e=>`<button id="q${e.id}" onclick="answer(${e.id})">${e.n}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div><div class="controls"><button id="next" class="primary" disabled onclick="nextQuestion()">다음 문제 →</button></div>`;return} $('view').innerHTML=`<h2>🚀 STEP 3. 타임라인 챌린지</h2><div class="levels">${Array.from({length:5},(_,i)=>`<span class="${i<wins?'won':i===round?'current':'locked'}">${i<wins?'✓':i===round?'🚀':'🔒'} ${i+1}</span>`).join('')}</div><p>챌린지 ${round+1} / 5 · 통과 ${wins} / 5 <div class="progress"><i style="width:${wins*20}%"></i></div></p><p class="muted">가장 오래된 사건부터 카드를 클릭하세요. 마지막 카드를 선택하면 자동으로 채점됩니다. 선택 중에는 ↑↓ 또는 ×로 수정할 수 있습니다. 같은 연도의 사건은 한 라운드에 하나만 출제됩니다.</p><h3>🃏 사건 카드</h3><div class="bank">${bank.filter(e=>!chosen.includes(e)).map(e=>`<button ${checked?'disabled':''} onclick="pick(${e.id})">${e.n}</button>`).join('')||'모든 카드를 선택했습니다.'}</div><h3>🕰️ 나의 연표 (${chosen.length}/${bank.length})</h3>${Array.from({length:bank.length},(_,i)=>{let e=chosen[i];return `<div class="slot ${checked?(e===sorted()[i]?'good':'bad'):''}"><b>${i+1}</b><span>${e?e.n:'사건을 선택하세요'} ${passed&&e?' · '+e.y+'년':''}</span>${e&&!checked?`<button aria-label="위로" onclick="move(${i},-1)" ${i===0?'disabled':''}>↑</button><button aria-label="아래로" onclick="move(${i},1)" ${i===chosen.length-1?'disabled':''}>↓</button><button aria-label="제거" onclick="chosen.splice(${i},1);render()">×</button>`:''}</div>`}).join('')}<div class="controls"><button class="primary" ${checked||chosen.length!==bank.length?'disabled':''} onclick="check()">정답 확인</button><button ${checked?'disabled':''} onclick="chosen=[];render()">배열 초기화</button><button ${checked&&!passed?'':'disabled'} onclick="retry()">같은 챌린지 다시 도전</button><button class="primary" ${passed?'':'disabled'} onclick="advance()">${wins===5?'성공 화면 보기':'다음 챌린지 →'}</button></div>${checked?`<div class="status" aria-live="polite"><strong>${chosen.every((e,i)=>e===sorted()[i])?'완벽합니다!':'다시 흐름을 확인해 보세요.'}</strong>${passed?'<p>정답 연표</p>'+sorted().map(e=>`${e.y}년 ${e.n}`).join(' → '):'<p>같은 챌린지에 다시 도전해야 다음 단계로 넘어갈 수 있습니다.</p>'}</div>`:''}`}
function nextQuestion(){if(mode!==1||!answered)return;qi++;answered=false;render()}
function answer(id){if(answered)return;let e=questions[qi].e;let ok=id===e.id;if(ok){answered=true;score++;$('q'+id).classList.add('good');document.querySelectorAll('.choices button').forEach(b=>b.disabled=true);$('feedback').innerHTML=`<div class="status"><strong>🎉 정답입니다!</strong><br>${e.y}년 · ${e.k}<br>${e.d}</div>`;$('next').disabled=false}else{$('q'+id).classList.add('bad');$('q'+id).disabled=true;$('feedback').innerHTML='<div class="status" role="alert"><strong>💡 오답입니다! 다시 도전하세요.</strong><br>정답을 맞혀야 다음 문제로 이동할 수 있어요.</div>';$('next').disabled=true}}
function pick(id){if(!checked){chosen.push(bank.find(e=>e.id===id));render();if(chosen.length===bank.length)check()}}function move(i,d){let j=i+d;if(j>=0&&j<chosen.length){[chosen[i],chosen[j]]=[chosen[j],chosen[i]];render()}}function sorted(){return [...bank].sort((a,b)=>Number(a.y)-Number(b.y))}function check(){if(checked||chosen.length!==bank.length)return;checked=true;attempts++;passed=chosen.every((e,i)=>e===sorted()[i]);if(passed)wins++;render();showResult()}function showResult(){const d=$('result');$('resultBody').innerHTML=passed?`<div style="font-size:60px">🏆</div><h2 style="color:#176b70">🎉 정답입니다!</h2><p>챌린지 ${round+1} 통과! (${wins}/5)</p><button class="primary" onclick="document.getElementById('result').close();advance()">${wins===5?'성공 화면 보기':'다음 챌린지 →'}</button> <button onclick="document.getElementById('result').close()">닫기</button>`:`<h2 style="color:#b85a45">💡 다시 도전!</h2><p>사건의 순서를 다시 생각해 보세요.<br>정답을 맞혀야 다음 챌린지로 이동할 수 있습니다.</p><button class="primary" onclick="document.getElementById('result').close();retry()">다시 도전</button> <button onclick="document.getElementById('result').close()">배열 확인</button>`;d.showModal()}
$('era').onchange=e=>{era=Number(e.target.value);start(mode)};start(0);
</script></body></html>
